name: Android and web quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "public/downloads/TruthMachine.apk"

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify web app
        run: |
          npm ci
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Preserve direct-install signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: truth-machine-debug-keystore-v1

      - name: Test, lint, and build Android app
        run: gradle -p android testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/TruthMachine.apk
          sha256sum release/TruthMachine.apk > release/TruthMachine.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TruthMachine-Android
          path: |
            release/TruthMachine.apk
            release/TruthMachine.apk.sha256
          if-no-files-found: error

      - name: Publish APK to website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public/downloads
          cp release/TruthMachine.apk public/downloads/TruthMachine.apk
          cp release/TruthMachine.apk.sha256 public/downloads/TruthMachine.apk.sha256

          if git diff --quiet -- public/downloads; then
            echo "APK is unchanged."
            exit 0
          fi

          git config user.name "truth-machine-build"
          git config user.email "actions@users.noreply.github.com"
          git add public/downloads/TruthMachine.apk public/downloads/TruthMachine.apk.sha256
          git commit -m "Publish verified Android APK [skip ci]"
          git push
